- id: TECH-DEBT-1-001
  title: Add validation type definitions for ARM template validation
  agent: devon
  effort: 1h
  priority: LOW
  dependencies: []
  phase: 1.5
  sprint: fixes
  description: |
    Add type definitions for template validation results and errors to the
    synthesis type system. These types will be used by the validation system
    (DEV-1-016) but defining them early improves type system completeness.

    **Motivation:**
    The SynthesisOptions interface includes a `validate` flag (line 472 in types.ts):
    ```typescript
    export interface SynthesisOptions {
      validate?: boolean;
    }
    ```

    However, there are no corresponding types for:
    - What a validation result looks like
    - How validation errors are structured
    - What severity levels exist
    - How to report validation warnings vs errors

    Defining these types now provides:
    - Clear contract for DEV-1-016 implementation
    - Better IDE autocomplete for developers
    - Type-safe validation error handling
    - Consistent validation across synthesizers

  acceptance_criteria:
    - ValidationResult interface defined with success/failure status
    - ValidationError interface defined with code, message, severity, location
    - ValidationSeverity enum defined (ERROR, WARNING, INFO)
    - ValidationContext type defined for error context
    - All types exported from types.ts
    - JSDoc documentation complete with examples
    - Types integrated with existing SynthesisResult

  files:
    - packages/component/src/synthesis/types.ts (add new validation section)

  implementation_guide: |
    Add after line 901 (end of SynthesisMetadata):

    ```typescript
    // ============================================================================
    // Validation Types
    // ============================================================================

    /**
     * ARM template validation severity levels
     */
    export enum ValidationSeverity {
      ERROR = 'error',
      WARNING = 'warning',
      INFO = 'info',
    }

    /**
     * ARM template validation error
     *
     * @remarks
     * Represents a single validation issue found during template validation.
     */
    export interface ValidationError {
      /**
       * Error code (e.g., 'INVALID_RESOURCE_NAME', 'MISSING_REQUIRED_PROPERTY')
       */
      readonly code: string;

      /**
       * Human-readable error message
       */
      readonly message: string;

      /**
       * Error severity level
       */
      readonly severity: ValidationSeverity;

      /**
       * Location in template where error occurred
       */
      readonly location?: {
        readonly resourceType?: string;
        readonly resourceName?: string;
        readonly property?: string;
        readonly line?: number;
      };

      /**
       * Suggested fix for the error
       */
      readonly suggestion?: string;
    }

    /**
     * ARM template validation result
     *
     * @remarks
     * Result of validating a synthesized ARM template.
     */
    export interface ValidationResult {
      /**
       * Whether validation passed (no errors, warnings allowed)
       */
      readonly success: boolean;

      /**
       * Validation errors found
       */
      readonly errors: readonly ValidationError[];

      /**
       * Validation warnings found
       */
      readonly warnings: readonly ValidationError[];

      /**
       * Informational messages
       */
      readonly info: readonly ValidationError[];

      /**
       * Validation timestamp
       */
      readonly validatedAt: Date;

      /**
       * Validation duration in milliseconds
       */
      readonly durationMs: number;
    }
    ```

- id: TECH-DEBT-1-002
  title: Add SchemaObject import aliasing to prevent confusion
  agent: devon
  effort: 0.5h
  priority: LOW
  dependencies: []
  phase: 1.5
  sprint: fixes
  description: |
    Add import aliasing to distinguish between data schema SchemaObject and
    OpenAPI SchemaObject types to prevent developer confusion.

    **Problem:**
    Two different SchemaObject types exist:
    1. data-synthesizer-types.ts imports from '../schema/types' (data model schema)
    2. openapi-types.ts defines SchemaObject (OpenAPI/JSON Schema)

    While they serve different purposes and shouldn't conflict, the same name
    could cause confusion when working across both files.

    **Solution:**
    Use import aliasing to make the distinction clear:
    ```typescript
    // In data-synthesizer-types.ts
    import type { SchemaObject as DataSchemaObject } from '../schema/types';
    ```

  acceptance_criteria:
    - Import aliased to DataSchemaObject in data-synthesizer-types.ts
    - All references updated to use DataSchemaObject
    - No naming conflicts anywhere in synthesis module
    - TypeScript compiles without errors
    - Documentation updated to clarify distinction

  files:
    - packages/component/src/synthesis/data-synthesizer-types.ts (modify imports and usage)

