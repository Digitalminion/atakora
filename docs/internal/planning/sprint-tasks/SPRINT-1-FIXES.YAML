  priority: LOW
  dependencies: []
  phase: 2
  sprint: enhancements
  description: |
    Create preset configurations for Cosmos DB that codify best practices for
    different environments (dev, staging, production).

    **Motivation:**
    While the documentation provides examples of dev vs prod configurations,
    having actual preset objects would:
    - Reduce boilerplate in user code
    - Codify best practices
    - Ensure consistent configurations
