- id: GRACE-4-001
  title: Create deployment script for ARM templates
  agent: grace
  effort: 3h
  dependencies: [DEV-3-015]
  phase: 4
  description: |
    Create deployment script that deploys generated ARM templates to Azure
    using Azure CLI. Support resource group creation and parameter injection.
  acceptance_criteria:
    - Script accepts ARM template path and parameters
    - Creates resource group if it doesn't exist
    - Deploys ARM template using az deployment group create
    - Monitors deployment progress
    - Reports deployment status and outputs
    - Handles deployment failures gracefully
    - Script is executable and documented
  files:
    - scripts/deploy-arm.sh (create)
    - scripts/deploy-arm.ps1 (create)
    - scripts/README.md (create)

- id: GRACE-4-002
  title: Create function deployment script
  agent: grace
  effort: 3h
  dependencies: [GRACE-4-001]
  phase: 4
  description: |
    Create deployment script that builds and deploys generated functions to Azure
    Function App. Handle TypeScript compilation and dependency installation.
  acceptance_criteria:
    - Script builds function code (npm install, tsc)
    - Creates deployment package (.zip)
    - Deploys to Azure Function App using az functionapp deployment
    - Verifies function app is running
    - Reports deployment status
    - Handles deployment failures gracefully
    - Script is executable and documented
  files:
    - scripts/deploy-functions.sh (create)
    - scripts/deploy-functions.ps1 (create)
    - scripts/README.md (modify)

- id: GRACE-4-003
  title: Create end-to-end deployment script
  agent: grace
  effort: 2h
  dependencies: [GRACE-4-002]
  phase: 4
  description: |
    Create orchestration script that runs complete deployment: ARM templates,
    functions, and configuration. Support environment-specific deployments.
  acceptance_criteria:
    - Script orchestrates full deployment workflow
    - Deploys ARM templates first
    - Waits for infrastructure deployment to complete
    - Extracts outputs from ARM deployment (URLs, keys)
    - Configures function app settings with outputs
    - Deploys functions
    - Validates deployment success
    - Script is executable and documented
  files:
    - scripts/deploy.sh (create)
    - scripts/deploy.ps1 (create)
    - scripts/README.md (modify)

